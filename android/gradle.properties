# Java 24+ restricts System::load for unnamed modules; Gradle native-platform needs this.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
android.enableJetifier=true
# Keep legacy DSL until full AGP 9 new DSL migration.
android.newDsl=false
# Built-in Kotlin requires Flutter 3.47+; keep disabled while plugins still apply KGP.
android.builtInKotlin=false
